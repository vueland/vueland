name: CI

on:
  pull_request:
  push:
    branches:
      - master

# Cancel superseded runs on a PR; never cancel runs on master.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # eslint.config.js imports @vueland/eslint-script-setup.
      # In a fresh CI checkout its package.json exports ./dist/index.mjs,
      # so the plugin must be built before ESLint starts.
      - name: Build ESLint workspace plugin
        run: pnpm run build:eslint

      - name: ESLint
        run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: vue-tsc
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Vitest
        run: pnpm run test

  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build publishable packages
        run: pnpm run build:packages

  changeset:
    name: Changeset
    # A changeset is required only when a *published* package's shipping code changes.
    # Ignored packages (docs, playground, e2e — see .changeset/config.json), CI, tooling,
    # root configs and test-only edits never need one.
    #
    # Pure git against the exact base SHA — we don't use `changeset status --since`, whose
    # internal merge-base heuristics are unreliable on a PR merge ref.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Diffs against the PR base — needs full history.
          fetch-depth: 0

      - name: Require a changeset for publishable changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          publishable=$(git diff --name-only "$BASE"...HEAD -- \
            packages/ui packages/utils-jit integrations/eslint-script-setup \
            ':(exclude)**/__tests__/**' \
            ':(exclude)**/*.spec.ts' \
            ':(exclude)**/CHANGELOG.md' \
            ':(exclude)**/tsconfig*.json' \
            ':(exclude)**/vitest.config.ts')

          if [ -z "$publishable" ]; then
            echo 'No publishable source changed — changeset not required.'
            exit 0
          fi

          echo 'Publishable source changed:'
          echo "$publishable"

          # A changeset (real or `pnpm changeset add --empty`) must ship with the change.
          added=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- \
            '.changeset/*.md' ':(exclude).changeset/README.md')

          if [ -z "$added" ]; then
            echo '::error::A published package changed but no changeset was added. Run `pnpm changeset` (or `pnpm changeset add --empty` for a no-release change).'
            exit 1
          fi

          echo 'Changeset(s) added:'
          echo "$added"

  commit-lint:
    name: Commit lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Lint PR title (conventional commits)
        # Pass the title through an env var to avoid shell injection.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose

  branch-name:
    name: Branch name
    # Only meaningful on PRs — validates the head branch against the naming convention.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # No setup/deps: the script uses only Node built-ins (runner has Node preinstalled).
      - name: Validate branch name
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-branch-name.mjs

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Chromium only — matches the CI project in apps/e2e/playwright.config.ts.
      - name: Install Playwright Chromium
        run: pnpm --filter @vueland/e2e exec playwright install --with-deps chromium
      - name: Run Playwright e2e
        # Playwright's webServer boots the playground (vite) itself.
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
